name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: native lib
        run: WERROR=1 ./build.sh
      - name: library for netstandard2.0, netstandard2.1 and net8.0
        run: dotnet build src/GoomeSharp -c Release
      - name: tests
        run: dotnet run --project tests/GoomeSharp.Tests -c Release
      - name: examples on the test backend
        env:
          GOOME_BACKEND: test
        run: |
          mkdir -p ci-out/hello ci-out/ui ci-out/app ci-out/custom ci-out/skinned ci-out/anything
          GOOME_TEST_SHOTS=ci-out/hello GOOME_TEST_SCRIPT="screen 640x360 1; 2 click 120,110; 3 click 150,190; 4 key hi; 5 hotkey alt+h; 6 hotkey alt+h; end 8" \
            dotnet run --project examples/Hello -c Release
          GOOME_TEST_SHOTS=ci-out/ui GOOME_TEST_SCRIPT="screen 1280x720 1; 3 click 100,150; 6 click 200,90; end 10" \
            dotnet run --project examples/UiDemo -c Release
          GOOME_TEST_SCRIPT="screen 640x360 1; end 3" dotnet run --project examples/Grab -c Release -- 0 10 10 100 50 ci-out/grab.ppm
          GOOME_TEST_SHOTS=ci-out/app GOOME_TEST_SCRIPT="screen 1x1 1; 2 click 30,12; 4 key hello; 6 close; end 10" dotnet run --project examples/App -c Release
          dotnet run --project examples/Offscreen -c Release -- ci-out/offscreen.ppm
          GOOME_TEST_SHOTS=ci-out/custom GOOME_TEST_SCRIPT="screen 1120x800 1; 3 click 600,293; 5 hover 860,520; 6 hold 1000,600 9; end 12" dotnet run --project examples/Custom -c Release
          GOOME_TEST_SHOTS=ci-out/skinned GOOME_TEST_SCRIPT="screen 980x680 1; 3 click 120,150; 5 hover 400,330; 6 click 190,350; 8 hover 700,120; end 14" dotnet run --project examples/Skinned -c Release
          GOOME_TEST_SHOTS=ci-out/anything GOOME_TEST_SCRIPT="screen 1320x940 1; 2 click 1095,223; 4 click 1095,370; 6 click 1150,280; 7 click 995,413; 8 key a42; 9 hover 760,420; end 13" dotnet run --project examples/Anything -c Release
          ls ci-out/hello | head -3
          test -s ci-out/grab.ppm
          test -s ci-out/offscreen.ppm
          test "$(ls ci-out/app | wc -l)" -gt 3
          test "$(ls ci-out/custom | wc -l)" -gt 3
          test "$(ls ci-out/skinned | wc -l)" -gt 3
          test "$(ls ci-out/anything | wc -l)" -gt 3
      - name: unity package
        if: runner.os == 'Linux'
        run: |
          tools/sync_unity.sh
          if [ -n "$(git status --porcelain -- unity)" ]; then
            git status --short -- unity
            echo "unity/ is out of date, run tools/sync_unity.sh and commit it"
            exit 1
          fi
          for f in x86_64/libgoome.so x86_64/goome.dll macOS/libgoome.dylib; do
            test -s "unity/com.goome-ui.goome/Runtime/Plugins/$f" || { echo "missing plugin $f"; exit 1; }
            test -s "unity/com.goome-ui.goome/Runtime/Plugins/$f.meta" || { echo "missing $f.meta"; exit 1; }
          done
          dotnet build tests/UnityStubs -c Release
          dotnet build tests/UnityStubs -c Release -p:InputSystem=true
      - name: universal mac lib for unity
        if: matrix.os == 'macos-latest'
        run: |
          ./build.sh universal
          lipo -archs runtimes/osx-universal/native/libgoome.dylib
          mkdir -p unity-out
          mv runtimes/osx-universal unity-out/
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest'
        with:
          name: unity-osx-universal
          path: unity-out/
      - name: same pixels as the c examples
        if: runner.os == 'Linux'
        env:
          GOOME_BACKEND: test
        run: |
          v=$(cat native/VERSION)
          mkdir -p build/c ci-out/c/hello ci-out/c/ui ci-out/c/custom ci-out/c/skinned ci-out/c/anything
          for e in hello ui custom skinned anything; do
            if ! curl -fsSL "https://raw.githubusercontent.com/goome-ui/c-goome/$v/examples/$e.c" -o build/c/$e.c; then
              echo "cant get c-goome $v from github, skipping the c compare"
              exit 0
            fi
            sed -i 's/pinned with goome_ui_pos/pinned with Ui.Pos/; s/pushed with goome_ui_push_icon/pushed with Ui.PushIcon/' build/c/$e.c
            sed -i 's|^    static const char \*const code\[\] = .*|    static const char *const code[] = {"var t = Theme.Make(0xFF8B5CF6, true, 12, u.Theme);", "u.PushTheme(t);", "u.Scale(1.25);"};|' build/c/$e.c
            cc -O2 -std=c99 -Inative -o build/c/$e build/c/$e.c native/goome_lib.c -lm
          done
          GOOME_TEST_SHOTS=ci-out/c/hello GOOME_TEST_SCRIPT="screen 640x360 1; 2 click 120,110; 3 click 150,190; 4 key hi; 5 hotkey alt+h; 6 hotkey alt+h; end 8" build/c/hello > /dev/null
          GOOME_TEST_SHOTS=ci-out/c/ui GOOME_TEST_SCRIPT="screen 1280x720 1; 3 click 100,150; 6 click 200,90; end 10" build/c/ui > /dev/null
          GOOME_TEST_SHOTS=ci-out/c/custom GOOME_TEST_SCRIPT="screen 1120x800 1; 3 click 600,293; 5 hover 860,520; 6 hold 1000,600 9; end 12" build/c/custom > /dev/null
          GOOME_TEST_SHOTS=ci-out/c/skinned GOOME_TEST_SCRIPT="screen 980x680 1; 3 click 120,150; 5 hover 400,330; 6 click 190,350; 8 hover 700,120; end 14" build/c/skinned > /dev/null
          GOOME_TEST_SHOTS=ci-out/c/anything GOOME_TEST_SCRIPT="screen 1320x940 1; 2 click 1095,223; 4 click 1095,370; 6 click 1150,280; 7 click 995,413; 8 key a42; 9 hover 760,420; end 13" build/c/anything > /dev/null
          for e in hello ui custom skinned anything; do
            n=$(ls ci-out/c/$e | wc -l)
            [ "$n" -gt 0 ] && [ "$n" = "$(ls ci-out/$e | wc -l)" ] || { echo "$e: different frame count"; exit 1; }
            for f in ci-out/c/$e/*; do cmp "$f" "ci-out/$e/$(basename "$f")" || { echo "$e: $(basename "$f") differs from the c one"; exit 1; }; done
            echo "$e: all $n frames match the c example"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: runtimes/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.os }}
          path: ci-out/
          if-no-files-found: ignore

  mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: native lib
        run: WERROR=1 ./build.sh
      - name: GoomeMod against fake unity, real harmony
        run: dotnet run --project tests/ModTests -c Release
      - name: templates against the nuget reference dlls
        run: |
          for t in BepInEx5 BepInEx6 MelonLoader; do
            dotnet build mods/templates/$t -c Release
          done
      - name: dist layouts
        run: |
          cd mods/templates
          check() {
            for f in "${@:2}"; do
              test -s "$1/$f" || { echo "missing $1/$f"; exit 1; }
            done
            echo "$1 ok"
          }
          natives="goome.dll libgoome.so libgoome.dylib"
          b=BepInEx/plugins/GoomeMenu
          check BepInEx5/bin/Release/netstandard2.0/dist $b/GoomeMenu.dll $b/GoomeMod.dll $b/GoomeSharp.dll $b/System.Memory.dll $(for n in $natives; do echo $b/$n; done)
          check BepInEx6/bin/Release/netstandard2.0/dist $b/GoomeMenu.dll $b/GoomeMod.dll $b/GoomeSharp.dll $b/System.Memory.dll $(for n in $natives; do echo $b/$n; done)
          check BepInEx6/bin/Release/net6.0/dist $b/GoomeMenu.dll $b/GoomeMod.dll $b/GoomeSharp.dll $(for n in $natives; do echo $b/$n; done)
          for tf in net472 net6.0; do
            check MelonLoader/bin/Release/$tf/dist Mods/GoomeMenu.dll UserLibs/GoomeMod.dll UserLibs/GoomeSharp.dll $(for n in $natives; do echo UserLibs/$n; done)
            test "$(ls MelonLoader/bin/Release/$tf/dist/Mods)" = GoomeMenu.dll || { echo "only the mod goes in Mods/"; exit 1; }
          done
          if find . -path '*/dist/*' -name '0Harmony.dll' -o -path '*/dist/*' -name 'BepInEx*.dll' -o -path '*/dist/*' -name 'MelonLoader.dll' -o -path '*/dist/*' -name 'UnityEngine*.dll' | grep .; then
            echo "loader or unity dlls got copied into dist"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mod-templates
          path: mods/templates/*/bin/Release/*/dist/

  pack:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: runtimes/
          merge-multiple: true
      - name: pack
        run: |
          find runtimes -type f
          dotnet pack src/GoomeSharp -c Release -o out
          unzip -l out/GoomeSharp.*.nupkg | tee out/contents.txt
          test -s out/GoomeSharp.*.snupkg || { echo "no symbols package"; exit 1; }
          for f in nuget.md icon.png runtimes/linux-x64/native/libgoome.so runtimes/win-x64/native/goome.dll runtimes/osx-arm64/native/libgoome.dylib runtimes/osx-x64/native/libgoome.dylib lib/netstandard2.0/GoomeSharp.dll lib/netstandard2.1/GoomeSharp.dll lib/net8.0/GoomeSharp.dll; do
            grep -q "$f" out/contents.txt || { echo "missing $f in the package"; exit 1; }
          done
      - name: use the package from a fresh project
        run: |
          mkdir -p feed try && cp out/*.nupkg feed/
          cd try
          dotnet new console -o . --force
          dotnet add package GoomeSharp --source ../feed --prerelease
          cat > Program.cs <<'CS'
          using GoomeSharp;
          using var g = new Goome(new GoomeOptions { Backend = Backend.Test, TestScript = "screen 320x200 1; end 2" });
          var c = g.Begin(0)!;
          c.DrawCircle(50, 50, 20, 0xFF6FDC5F);
          g.End(c, new Rect(30, 30, 40, 40));
          System.Console.WriteLine($"{g.BackendName} {g.Monitors[0].Area} alpha {g.AlphaAt(50, 50)}");
          if (g.AlphaAt(50, 50) != 255) return 1;
          using var off = Goome.OpenOffscreen(200, 100);
          var oc = off.Begin(0)!;
          oc.DrawRect(0, 0, 10, 10, 0xFF102030);
          off.End(oc);
          System.Console.WriteLine($"offscreen {off.Frame().Width}x{off.Frame().Height}");
          return off.Frame()[5, 5] == 0xFF102030 ? 0 : 1;
          CS
          dotnet run
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            out/*.nupkg
            out/*.snupkg
      - uses: actions/download-artifact@v4
        with:
          name: unity-osx-universal
          path: runtimes/
      - name: unity plugins
        run: |
          mkdir -p unity-plugins/x86_64 unity-plugins/macOS
          cp runtimes/linux-x64/native/libgoome.so runtimes/win-x64/native/goome.dll unity-plugins/x86_64/
          cp runtimes/osx-universal/native/libgoome.dylib unity-plugins/macOS/
          find unity-plugins -type f
      - uses: actions/upload-artifact@v4
        with:
          name: unity-plugins
          path: unity-plugins/
